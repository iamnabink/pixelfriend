<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelFriend Character</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { background: radial-gradient(120% 90% at 50% 20%, #2b3148 0%, #141827 60%, #0d101a 100%); }
    body.transparent { background: transparent; }
    #character { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
    #character svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="character"></div>
  <script src="dist/character.bundle.js"></script>
</body>
</html>
